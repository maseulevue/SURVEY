<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Name
		<input id='Name' type='text'>
		Age
		<input id='Age' type='number'>
		Birthday
		<input id='Birthday' type='text'>
		Gender
		<input id="Gender" type='text'>
		Email
		<input id="Email" type='text'>
		Contact Number
		<input id="CN" type='text'>
		Work
		<input id="Work" type='text'>
		Year Experince
		<input id="YE" type='text'>
		Achivements
		<input id="Achivements" type='text'>
		Address
		<input id="Address" type='text'>
		<button type="button" onclick="clickButton( document.getElementById('Name').value ,document.getElementById('Age').value , document.getElementById('Birthday').value, document.getElementById('Gender').value, document.getElementById('Email').value, document.getElementById('CN').value, document.getElementById('Work').value, document.getElementById('YE').value, document.getElementById('Achivements').value, document.getElementById('Address').value)">Click Me!</button>

		<script>




		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			if (a=='' || b=='' || c=='' || d=='' || e=='' || f=='' || g=='' || h=='' || i=='' || j=='') {
				alert('Please fill in all fields');
				return;
			}

			const postData = {
				Name:a,
				Age:b,
				Birthday:c,
				Gender:d,
				Email:e,
				CN:f,
				Work:g,
				YE:h,
				Achivement:i,
				Address:j

			};

			async function fetchData() {
				try {
					const response = await axios.post('http://127.0.0.1:8000/Survey', postData);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error);
					alert('Survey was not saved. Please check your answers.');
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
